<!DOCTYPE html>
<html lang="zh">

<meta charset="UTF-8" />

<meta name="keywords" content="粒子特效, 圣诞树, 手势识别, 交互式, 摄像头, MediaPipe, 网页特效">

<meta name="referrer" content="strict-origin-when-cross-origin">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  }
  #introPage h2 {

  body {

  #fpsDisplay {

  #loading {

  @media (max-height: 600px) {
    #introPage {
      justify-content: flex-start;

    }
    
    #introPage h2 {

    }
  }

  [hidden] { display: none !important; }
  button { min-height: 44px; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid #fff0b5; outline-offset: 4px; }

  #controlPanel { flex-direction: row; flex-wrap: wrap; max-width: calc(100vw - 130px); }
  .controlBtn { background: #213e55; color: #f0f7ff; min-width: 92px; transition: background 0.2s; }

  #cameraStatus { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 10px 16px; color: #e2edf9; background: rgba(10, 24, 38, 0.92); border: 1px solid #30445b; border-radius: 24px; font-size: 13px; text-align: center; z-index: 101; line-height: 1.5; pointer-events: none; }
  #loading { z-index: 10000; width: min(360px, calc(100% - 40px)); text-align: center; color: #c2e8ff; pointer-events: none; }

  @media (max-width: 480px) {

    #fpsDisplay { top: 70px; right: 12px; }

</style>

<body>
<section id="introPage" aria-labelledby="introTitle">
  <div class="intro-card">
    <p class="eyebrow">用手势，点亮冬日</p>
    <h1 id="introTitle">你的粒子圣诞树</h1>
    <p>让指尖的移动，变成一树星光。</p>
    <div class="gestures" aria-label="手势操作说明">
      <div class="gesture"><strong>靠近 / 远离</strong><span>放大或缩小圣诞树</span></div>
      <div class="gesture"><strong>上下 / 左右</strong><span>带着星光一起移动</span></div>
    </div>
    <p class="privacy">只有选择手势体验，才会申请摄像头权限。<br>暂停或切换页面时会关闭摄像头，不使用麦克风。</p>
    <p class="privacy">手势功能需联网加载 MediaPipe；视频帧交给浏览器内的识别库处理。</p>
    <p id="cameraError" role="alert" hidden></p>
    <div class="intro-actions">
      <button id="startBtn" type="button">开启摄像头，开始体验</button>
      <button id="demoBtn" class="secondary" type="button">仅观看演示 · 无需摄像头</button>
    </div>
    <p class="shortcut-hint">空格：暂停 / 继续 · P：切换画质 · Esc：返回说明</p>
  </div>
</section>

<div id="controlPanel" aria-label="体验控制" hidden>
  <button id="pauseBtn" class="controlBtn" type="button" aria-pressed="false">暂停体验</button>
  <button id="cameraBtn" class="controlBtn" type="button">开启手势</button>
  <button id="performanceBtn" class="controlBtn" type="button" aria-pressed="false">性能模式</button>
</div>

<div id="fpsDisplay" aria-label="动画帧率">FPS: 0</div>
<div id="mobileWarning" hidden>性能模式已开启，粒子数量已降低</div>
<p id="cameraStatus" role="status" aria-live="polite">摄像头未开启 · 可选择手势或演示</p>
<div id="loading" role="status" hidden>请在浏览器提示中选择是否允许摄像头</div>

<canvas id="treeCanvas" aria-label="可用手势控制的粒子圣诞树"></canvas>
<video id="videoFeed" autoplay playsinline muted aria-label="摄像头预览" hidden></video>

<script>
// ====== 全局变量和配置 ======
const canvas = document.getElementById("treeCanvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("videoFeed");
const pauseBtn = document.getElementById("pauseBtn");
const fpsDisplay = document.getElementById("fpsDisplay");
const loading = document.getElementById("loading");
const mobileWarning = document.getElementById("mobileWarning");

// 性能配置
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
let performanceMode = isMobile;
let isPaused = true;
let cameraStarted = false;

// 动态粒子数量
const getParticleCount = () => {
  if (performanceMode) {
    return Math.min(800, Math.floor(window.innerWidth * window.innerHeight / 1200));
  }
  return Math.min(2600, Math.floor(window.innerWidth * window.innerHeight / 400));
};

// ====== 画布与延迟加载的手势识别 ======
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();

let hands = null;
let handsLoading = null;
const HANDS_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/';
function ensureHands() {
  if (hands) return Promise.resolve(hands);
  if (handsLoading) return handsLoading;
  handsLoading = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    let timer;
    const fail = () => {
      clearTimeout(timer);
      script.remove();
      reject(new Error('ModelLoadError'));
    };
    script.src = HANDS_BASE + 'hands.min.js';
    script.onload = () => {
      clearTimeout(timer);
      try {
        const instance = new Hands({ locateFile: file => HANDS_BASE + file });
        instance.setOptions({
          maxNumHands: 1, modelComplexity: 0,
          minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
        });
        instance.onResults(results => {
          if (instance === hands && cameraStarted && !isPaused && resultEpoch === cameraEpoch &&
              results.multiHandLandmarks?.length) {
            particleSystem.updateFromHandData(results.multiHandLandmarks[0], Date.now());
          }
        });
        hands = instance;
        resolve(instance);
      } catch {
        fail();
      }
    };
    script.onerror = fail;
    timer = setTimeout(fail, 15000);
    document.head.append(script);
  }).catch(error => {
    handsLoading = null;
    throw error;
  });
  return handsLoading;
}

// ====== 粒子系统 ======
class ParticleSystem {
  constructor() {
    this.particles = [];
    this.lights = [];
    this.snow = [];
    this.sparks = [];
    this.scaleFactor = 1.0;
    this.treeOffsetX = 0;
    this.treeOffsetY = 0;
    this.sparkCooldown = 0;
    this.SPARK_COOLDOWN = 300;
    this.time = 0;
    this.initializeParticles();
  }
  
  initializeParticles() {
    const particleCount = getParticleCount();
    this.particles = [];
    for (let i = 0; i < particleCount; i++) {
      this.particles.push(this.createTreeParticle());
    }
    
    const lightCount = performanceMode ? 80 : 160;
    this.lights = [];
    for (let i = 0; i < lightCount; i++) {
      this.lights.push(this.createLightParticle());
    }
    
    const snowCount = performanceMode ? 80 : 150;
    this.snow = [];
    for (let i = 0; i < snowCount; i++) {
      this.snow.push(this.createSnowParticle());
    }
  }
  
  createTreeParticle() {
    const y = Math.random();
    const spread = y * 200;
    
    return {
      x: canvas.width / 2 + (Math.random() * 2 - 1) * spread,
      y: canvas.height * 0.1 + y * (canvas.height * 0.7),
      size: 1 + Math.random() * 2,
      alpha: 0.4 + Math.random() * 0.6,
      color: `rgba(${40 + Math.random()*30}, ${160 + Math.random()*50}, ${40 + Math.random()*40},`,
      swayOffset: Math.random() * Math.PI * 2
    };
  }
  
  createLightParticle() {
    const lightColors = [
      "rgba(255, 80, 80,",
      "rgba(80, 170, 255,",
      "rgba(255, 220, 80,",
      "rgba(120, 255, 120,"
    ];
    
    const y = Math.random();
    const spread = y * 180;
    
    return {
      x: canvas.width / 2 + (Math.random() * 2 - 1) * spread,
      y: canvas.height * 0.15 + y * (canvas.height * 0.65),
      size: performanceMode ? 2 : 2.5,
      alpha: 0.3 + Math.random() * 0.7,
      color: lightColors[Math.floor(Math.random() * lightColors.length)],
      blinkSpeed: Math.random() * 0.05 + 0.02,
      blinkOffset: Math.random() * Math.PI * 2
    };
  }
  
  createSnowParticle() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * (performanceMode ? 1.5 : 2) + 1,
      speed: Math.random() * (performanceMode ? 0.8 : 1) + 0.5,
      alpha: Math.random() * 0.8 + 0.2,
      drift: (Math.random() - 0.5) * 0.5
    };
  }
  
  updateFromHandData(hand, timestamp) {
    if (!hand) return;
    
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    hand.forEach(pt => {
      minX = Math.min(minX, pt.x);
      maxX = Math.max(maxX, pt.x);
      minY = Math.min(minY, pt.y);
      maxY = Math.max(maxY, pt.y);
    });
    
    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;
    
    // 平滑移动
    const targetX = (centerX - 0.5) * canvas.width * 0.4;
    const targetY = (centerY - 0.5) * canvas.height * 0.35;
    const lerpFactor = 0.15;
    
    this.treeOffsetX += (targetX - this.treeOffsetX) * lerpFactor;
    this.treeOffsetY += (targetY - this.treeOffsetY) * lerpFactor;
    
    // 限制范围
    const maxOffsetX = canvas.width * 0.25;
    const maxOffsetY = canvas.height * 0.25;
    this.treeOffsetX = Math.max(-maxOffsetX, Math.min(maxOffsetX, this.treeOffsetX));
    this.treeOffsetY = Math.max(-maxOffsetY, Math.min(maxOffsetY, this.treeOffsetY));
    
    const boxW = maxX - minX;
    const boxH = maxY - minY;
    const handSize = Math.max(boxW, boxH);
    
    this.scaleFactor = Math.max(0.3, Math.min(2.0, 0.4 + handSize * 3.0));
    
    // 火花效果
    if (handSize > 0.28 && timestamp - this.sparkCooldown > this.SPARK_COOLDOWN) {
      this.sparkCooldown = timestamp;
      const sparkCenterX = canvas.width / 2 + this.treeOffsetX;
      const sparkCenterY = canvas.height / 2 + this.treeOffsetY;
      const sparkCount = performanceMode ? 20 : 40;
      
      for (let i = 0; i < sparkCount; i++) {
        this.sparks.push({
          x: sparkCenterX,
          y: sparkCenterY,
          vx: (Math.random()*2-1)*6,
          vy: (Math.random()*2-1)*6,
          life: 30
        });
      }
    }
  }
  
  update(deltaTime) {
    this.time += deltaTime;
    
    // 更新火花
    for (let i = this.sparks.length - 1; i >= 0; i--) {
      const s = this.sparks[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vx *= 0.95;
      s.vy *= 0.95;
      s.life--;
      if (s.life <= 0) this.sparks.splice(i, 1);
    }
    
    // 更新雪花
    this.snow.forEach(s => {
      s.y += s.speed;
      s.x += s.drift;
      if (s.y > canvas.height) {
        s.y = -10;
        s.x = Math.random() * canvas.width;
      }
      if (s.x < -10) s.x = canvas.width + 10;
      if (s.x > canvas.width + 10) s.x = -10;
    });
    
    // 更新彩灯闪烁
    this.lights.forEach(l => {
      l.alpha = 0.3 + Math.sin(this.time * l.blinkSpeed + l.blinkOffset) * 0.35 + 0.35;
    });
  }
  
  draw() {
    const sway = Math.sin(this.time * 0.5) * 0.06;
    
    ctx.save();
    ctx.translate(canvas.width/2 + this.treeOffsetX, canvas.height/2 + this.treeOffsetY);
    ctx.scale(this.scaleFactor, this.scaleFactor);
    ctx.translate(-canvas.width/2 - this.treeOffsetX, -canvas.height/2 - this.treeOffsetY);
    
    // 树粒子
    ctx.shadowBlur = performanceMode ? 4 : 6;
    ctx.shadowColor = "rgba(80,255,160,0.7)";
    
    this.particles.forEach(p => {
      const particleSway = Math.sin(this.time * 0.5 + p.swayOffset) * 0.03;
      ctx.fillStyle = p.color + p.alpha + ")";
      ctx.beginPath();
      ctx.arc(p.x + particleSway * 50, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    
    // 绘制星星
    const starOffsetX = sway * 16;
    ctx.save();
    ctx.translate(canvas.width / 2 + starOffsetX, canvas.height * 0.1 - 25);
    ctx.scale(1.4, 1.4);
    
    // 绘制五角星
    ctx.beginPath();
    const outerR = 20;
    const innerR = 8;
    for (let i = 0; i < 10; i++) {
      const angle = (i * 36 - 90) * Math.PI / 180;
      const r = i % 2 === 0 ? outerR : innerR;
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    
    // 星星发光效果
    const starGlow = 0.7 + Math.sin(this.time * 2) * 0.3;
    ctx.fillStyle = `rgba(255, 255, 180, ${starGlow})`;
    ctx.shadowBlur = performanceMode ? 12 : 18;
    ctx.shadowColor = "rgba(255,255,200,0.9)";
    ctx.fill();
    
    // 星星内层高光
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 220, ${0.5 + starGlow * 0.5})`;
    ctx.shadowBlur = 8;
    ctx.fill();
    
    ctx.restore();
    
    // 彩灯
    this.lights.forEach(l => {
      ctx.fillStyle = l.color + l.alpha + ")";
      ctx.beginPath();
      ctx.arc(l.x, l.y, l.size, 0, Math.PI * 2);
      ctx.fill();
      
      // 灯光光晕
      ctx.shadowBlur = 10;
      ctx.shadowColor = l.color.replace('rgba(', '').split(',')[0] + ',' + 
                        l.color.replace('rgba(', '').split(',')[1] + ',' +
                        l.color.replace('rgba(', '').split(',')[2].split(')')[0] + ',0.5)';
      ctx.fill();
      ctx.shadowBlur = 0;
    });
    
    // 火花
    this.sparks.forEach(s => {
      const sparkAlpha = s.life / 30;
      ctx.fillStyle = `rgba(255,${200 - s.life},${80 - s.life},${sparkAlpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 3 * sparkAlpha, 0, Math.PI * 2);
      ctx.fill();
    });
    
    // 雪花
    ctx.shadowBlur = 0;
    this.snow.forEach(s => {
      ctx.fillStyle = "rgba(255,255,255," + s.alpha + ")";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
    
    ctx.restore();
  }
}

// ====== 初始化系统 ======
const particleSystem = new ParticleSystem();

// ====== FPS 计数器 ======
class FPSCounter {
  constructor() {
    this.fps = 0;
    this.frameCount = 0;
    this.lastTime = performance.now();
    this.lastUpdate = this.lastTime;
    this.frameTimes = [];
  }
  
  update(currentTime) {
    this.frameCount++;
    const delta = currentTime - this.lastTime;
    this.frameTimes.push(delta);
    
    if (this.frameTimes.length > 60) {
      this.frameTimes.shift();
    }
    
    if (currentTime - this.lastUpdate >= 1000) {
      this.fps = Math.round(this.frameCount * 1000 / (currentTime - this.lastUpdate));
      this.frameCount = 0;
      this.lastUpdate = currentTime;
      
      // 计算平均帧时间
      const avgFrameTime = this.frameTimes.reduce((a, b) => a + b, 0) / this.frameTimes.length;
      
      // 更新显示
      fpsDisplay.textContent = `FPS: ${this.fps} ${performanceMode ? '🚀' : ''}`;
      
      // 如果帧率过低，建议性能模式
      if (this.fps < 30 && !performanceMode && !isMobile) {
        fpsDisplay.style.color = '#ff9900';
        fpsDisplay.title = `平均帧时间: ${avgFrameTime.toFixed(1)}ms - 建议切换到性能模式`;
      } else {
        fpsDisplay.style.color = '#0f0';
        fpsDisplay.title = `平均帧时间: ${avgFrameTime.toFixed(1)}ms`;
      }
    }
    
    this.lastTime = currentTime;
    return delta;
  }
}

const fpsCounter = new FPSCounter();

// ====== 独立的动画循环 ======
let animationFrame = null;
let lastTimestamp = 0;
function animate(timestamp) {
  animationFrame = null;
  if (isPaused) return;
  const deltaTime = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, 0.05) : 0;
  lastTimestamp = timestamp;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particleSystem.update(deltaTime);
  particleSystem.draw();
  fpsCounter.update(timestamp);
  animationFrame = requestAnimationFrame(animate);
}

function resumeAnimation() {
  isPaused = false;
  lastTimestamp = 0;
  fpsCounter.lastTime = fpsCounter.lastUpdate = performance.now();
  fpsCounter.frameCount = 0;
  fpsCounter.frameTimes = [];
  if (animationFrame === null) animationFrame = requestAnimationFrame(animate);
  updateControls();
}

// ====== 摄像头生命周期 ======
const introPage = document.getElementById('introPage');
const controlPanel = document.getElementById('controlPanel');
const startBtn = document.getElementById('startBtn');
const cameraBtn = document.getElementById('cameraBtn');
const demoBtn = document.getElementById('demoBtn');
const cameraStatus = document.getElementById('cameraStatus');
const cameraError = document.getElementById('cameraError');
const performanceBtn = document.getElementById('performanceBtn');
let stream = null;
let cameraEpoch = 0;
let resultEpoch = -1;
let cameraPending = false;
let trackingFrame = null;
let trackingBusy = false;
let mode = 'demo';

function setStatus(message) {
  cameraStatus.textContent = message;
}
function updateControls() {
  startBtn.disabled = cameraPending;
  cameraBtn.disabled = cameraPending;
  startBtn.textContent = cameraPending ? '正在请求摄像头…' :
    (cameraError.hidden ? '开启摄像头，开始体验' : '重试开启摄像头');
  cameraBtn.textContent = cameraPending ? '正在开启…' : cameraStarted ? '关闭手势' : '开启手势';
  pauseBtn.textContent = cameraPending && mode === 'gesture' ? '取消开启' : isPaused ? '继续体验' : '暂停体验';
  pauseBtn.setAttribute('aria-pressed', String(isPaused));
  pauseBtn.classList.toggle('pause', isPaused);
  performanceBtn.textContent = performanceMode ? '切换高画质' : '性能模式';
  performanceBtn.setAttribute('aria-pressed', String(performanceMode));
  mobileWarning.hidden = !performanceMode || !introPage.hidden;
  mobileWarning.style.display = mobileWarning.hidden ? 'none' : 'block';
}
function releaseStream(mediaStream) {
  mediaStream?.getTracks().forEach(track => track.stop());
}
function stopCamera() {
  // 让尚未完成的权限、播放、识别任务失效，迟到的媒体流也会立即关闭。
  cameraEpoch++;
  cameraStarted = false;
  if (trackingFrame !== null) cancelAnimationFrame(trackingFrame);
  trackingFrame = null;
  releaseStream(stream);
  stream = null;
  video.pause();
  video.srcObject = null;
  video.hidden = true;
  loading.hidden = true;
  updateControls();
}
function pauseExperience(message = '已暂停 · 摄像头已关闭') {
  isPaused = true;
  stopCamera();
  if (animationFrame !== null) cancelAnimationFrame(animationFrame);
  animationFrame = null;
  lastTimestamp = 0;
  fpsDisplay.textContent = 'FPS: 已暂停';
  setStatus(message);
  updateControls();
}
function showExperience() {
  introPage.hidden = true;
  controlPanel.hidden = false;
  updateControls();
  pauseBtn.focus();
}
function showIntro() {
  pauseExperience();
  controlPanel.hidden = true;
  introPage.hidden = false;
  updateControls();
  startBtn.focus();
}
function showCameraError(error) {
  const messages = {
    NotAllowedError: '摄像头权限未获允许。可在地址栏的网站设置中允许后重试，或选择无需摄像头的演示。',
    PermissionDeniedError: '摄像头权限未获允许。请检查网站权限设置，或选择演示。',
    NotFoundError: '未找到摄像头。连接设备后可重试，也可以直接观看演示。',
    DevicesNotFoundError: '未找到摄像头。请检查设备连接，或选择演示。',
    NotReadableError: '摄像头暂时无法使用，可能正被其他程序占用。关闭占用程序后可重试。',
    TrackStartError: '摄像头暂时无法使用。请关闭其他使用摄像头的程序后重试。',
    OverconstrainedError: '摄像头不支持所需配置。请尝试其他设备，或选择演示。',
    InsecureContext: '摄像头需要 HTTPS 或 localhost。请通过安全地址访问，或选择演示。',
    UnsupportedBrowser: '此浏览器不支持摄像头访问。可使用支持的浏览器，或选择演示。',
    CameraEnded: '摄像头连接已中断或权限已被撤销。检查设备和权限后可重试。',
    CameraTimeout: '摄像头或识别模型启动超时。检查网络和设备后可重试。'
  };
  pauseExperience('手势暂不可用 · 仍可观看演示');
  cameraError.textContent = messages[error.name] ||
    '手势识别加载失败。请检查网络后重试，或选择无需联网加载识别库的演示。';
  cameraError.hidden = false;
  introPage.hidden = false;
  controlPanel.hidden = true;
  updateControls();
  demoBtn.focus();
}
function withTimeout(promise, duration) {
  let timer;
  return Promise.race([
    promise,
    new Promise((_, reject) => {
      timer = setTimeout(() => reject(new DOMException('启动超时', 'CameraTimeout')), duration);
    })
  ]).finally(() => clearTimeout(timer));
}
async function trackHands(epoch) {
  trackingFrame = null;
  if (epoch !== cameraEpoch || !cameraStarted || isPaused) return;
  if (!trackingBusy && video.readyState >= 2) {
    trackingBusy = true;
    resultEpoch = epoch;
    try {
      await withTimeout(hands.send({ image: video }), 15000);
    } catch (error) {
      // 模型失败后重建实例，避免沿用出错的识别任务。
      if (epoch === cameraEpoch) {
        const failedHands = hands;
        hands = null;
        handsLoading = null;
        Promise.resolve().then(() => failedHands?.close()).catch(() => {});
        showCameraError(error);
      }
    } finally {
      trackingBusy = false;
    }
  }
  if (epoch === cameraEpoch && cameraStarted && !isPaused) {
    trackingFrame = requestAnimationFrame(() => trackHands(epoch));
  }
}
async function startGesture() {
  if (cameraPending || document.hidden) return;
  if (!window.isSecureContext) {
    showCameraError(new DOMException('', 'InsecureContext'));
    return;
  }
  if (!navigator.mediaDevices?.getUserMedia) {
    showCameraError(new DOMException('', 'UnsupportedBrowser'));
    return;
  }
  stopCamera();
  const epoch = cameraEpoch;
  mode = 'gesture';
  cameraPending = true;
  cameraError.hidden = true;
  loading.hidden = false;
  loading.style.display = 'block';
  loading.textContent = '请在浏览器提示中选择是否允许摄像头';
  setStatus('等待你的摄像头授权 · 可随时选择演示');
  updateControls();
  try {
    const acquired = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    if (epoch !== cameraEpoch || document.hidden) {
      releaseStream(acquired);
      return;
    }
    stream = acquired;
    video.srcObject = stream;
    stream.getVideoTracks().forEach(track => track.addEventListener('ended', () => {
      if (epoch === cameraEpoch) showCameraError(new DOMException('', 'CameraEnded'));
    }, { once: true }));
    loading.textContent = '摄像头已连接，正在加载手势识别…';
    await withTimeout(video.play(), 10000);
    if (epoch !== cameraEpoch || document.hidden) return;
    await ensureHands();
    if (epoch !== cameraEpoch || document.hidden) return;
    cameraStarted = true;
    video.hidden = false;
    showExperience();
    resumeAnimation();
    setStatus('手势已开启 · 暂停时关闭摄像头');
    trackingFrame = requestAnimationFrame(() => trackHands(epoch));
  } catch (error) {
    if (epoch === cameraEpoch) showCameraError(error);
  } finally {
    cameraPending = false;
    // 旧任务结束时，不覆盖用户已经选择的演示或暂停状态。
    if (epoch === cameraEpoch) loading.hidden = true;
    updateControls();
  }
}
function startDemo() {
  stopCamera();
  mode = 'demo';
  cameraError.hidden = true;
  showExperience();
  resumeAnimation();
  setStatus('演示模式 · 摄像头已关闭');
}
function togglePause() {
  if (!isPaused || (cameraPending && mode === 'gesture')) {
    pauseExperience();
  } else if (mode === 'gesture') {
    startGesture();
  } else {
    resumeAnimation();
    setStatus('演示模式 · 摄像头已关闭');
  }
}
function togglePerformanceMode() {
  performanceMode = !performanceMode;
  particleSystem.initializeParticles();
  if (isPaused) drawStill();
  updateControls();
}
function drawStill() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particleSystem.draw();
}

startBtn.addEventListener('click', startGesture);
demoBtn.addEventListener('click', startDemo);
pauseBtn.addEventListener('click', togglePause);
performanceBtn.addEventListener('click', togglePerformanceMode);
cameraBtn.addEventListener('click', () => {
  if (cameraStarted) startDemo();
  else startGesture();
});
window.addEventListener('resize', () => {
  resizeCanvas();
  particleSystem.initializeParticles();
  if (isPaused) drawStill();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseExperience('已离开页面 · 摄像头已关闭，返回后请点击继续');
});
window.addEventListener('pagehide', () => pauseExperience());
document.addEventListener('keydown', event => {
  // 保留按钮的原生空格/回车行为，避免双重触发和输入时误触快捷键。
  if (event.repeat || event.ctrlKey || event.metaKey || event.altKey ||
      event.target.closest('button, input, textarea, select, [contenteditable]')) return;
  if (event.code === 'Escape' && introPage.hidden) {
    event.preventDefault();
    showIntro();
  } else if (introPage.hidden && event.code === 'Space') {
    event.preventDefault();
    togglePause();
  } else if (introPage.hidden && event.code === 'KeyP') {
    event.preventDefault();
    togglePerformanceMode();
  }
});

drawStill();
updateControls();
</script>
</body>
</html>
